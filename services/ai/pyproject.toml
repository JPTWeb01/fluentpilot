[project]
name = "fluentpilot-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "groq>=1.5,<2.0",
    "google-genai>=2.14,<3.0",
    "piper-tts>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluentpilot_ai = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
